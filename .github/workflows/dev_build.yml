name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -A2 -E "error:|FAILED|What went wrong" build.log | head -60 | while IFS= read -r l; do echo "::error::${l}"; done
          fi
          exit $code
      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          name: Dev Build
          prerelease: true
          files: build/libs/*.jar
