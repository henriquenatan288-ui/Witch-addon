name: visual
on:
  push:
    branches: [visual-test]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers libxrandr2 libxinerama1 libxcursor1 libxi6
      - name: Client gametest
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
        run: |
          set -o pipefail
          chmod +x gradlew
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGametest --stacktrace --console=plain 2>&1 | tee visual.log || true
          mkdir -p out
          find . -path ./out -prune -o -name "*.png" -path "*screenshots*" -exec cp {} out/ \; || true
          tail -1500 visual.log > out/visual-tail.log
          grep -n -E "What went wrong|Exception|Caused by|error:|Mixin|TEST|Intro" visual.log | head -30 | while IFS= read -r l; do echo "::notice::${l}"; done
          rm -rf /tmp/sr; mkdir -p /tmp/sr; cp -r out/* /tmp/sr/ || true
          cd /tmp/sr
          git init -q; git checkout -q -b visual-shots
          git config user.name ci; git config user.email ci@example.com
          git add -A; git commit -q -m shots || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f origin visual-shots || true
